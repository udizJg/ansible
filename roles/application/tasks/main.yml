---
# ===========================================
# ROL: APPLICATION
# ===========================================
# Este rol configura una aplicación básica
# Incluye configuración de la aplicación y archivos de código

- name: Mostrar información del rol application
  debug:
    msg: |
      📱 INICIANDO ROL: APPLICATION
      Rol: {{ role_name }}
      Host: {{ inventory_hostname }}
      Usuario: {{ ansible_user_id }}

- name: Crear directorio base de la aplicación
  file:
    path: '{{ app_base_dir }}'
    state: directory
    mode: '0755'
    owner: '{{ ansible_user_id }}'
    group: '{{ ansible_user_gid }}'

- name: Crear directorio de código fuente
  file:
    path: '{{ app_src_dir }}'
    state: directory
    mode: '0755'
    owner: '{{ ansible_user_id }}'
    group: '{{ ansible_user_gid }}'

- name: Crear directorio de configuración
  file:
    path: '{{ app_config_dir }}'
    state: directory
    mode: '0755'
    owner: '{{ ansible_user_id }}'
    group: '{{ ansible_user_gid }}'

- name: Crear directorio de logs
  file:
    path: '{{ app_logs_dir }}'
    state: directory
    mode: '0755'
    owner: '{{ ansible_user_id }}'
    group: '{{ ansible_user_gid }}'

- name: Crear directorio de configuración
  file:
    path: '{{ app_config_dir }}'
    state: directory
    mode: '0755'
    owner: '{{ ansible_user_id }}'
    group: '{{ ansible_user_gid }}'

- name: Crear archivo de configuración de la aplicación
  template:
    src: app.conf.j2
    dest: '{{ app_config_dir }}/app.conf'
    mode: '0644'
    owner: '{{ ansible_user_id }}'
    group: '{{ ansible_user_gid }}'
  notify: restart application

- name: Crear archivo principal de la aplicación
  template:
    src: main.py.j2
    dest: '{{ app_src_dir }}/main.py'
    mode: '0755'
    owner: '{{ ansible_user_id }}'
    group: '{{ ansible_user_gid }}'

- name: Crear archivo de requisitos
  copy:
    content: |
      flask==2.3.3
      sqlalchemy==2.0.21
      python-dotenv==1.0.0
      requests==2.31.0
      pytest==7.4.2
    dest: '{{ app_src_dir }}/requirements.txt'
    mode: '0644'
    owner: '{{ ansible_user_id }}'
    group: '{{ ansible_user_gid }}'

- name: Crear archivo de estado de la aplicación
  copy:
    content: |
      # Estado de la aplicación
      # Rol: {{ role_name }}
      # Configurado: {{ ansible_date_time.iso8601 }}
      # Host: {{ ansible_hostname }}
      # Puerto: {{ app_port }}
      # Directorio: {{ app_base_dir }}
      # Estado: Activo
    dest: '{{ app_base_dir }}/status.txt'
    mode: '0644'
    owner: '{{ ansible_user_id }}'
    group: '{{ ansible_user_gid }}'

- name: Mostrar resumen de la aplicación
  debug:
    msg: |
      ✅ APLICACIÓN CONFIGURADA
      Rol: {{ role_name }}
      Directorio: {{ app_base_dir }}
      Puerto: {{ app_port }}
      Nombre: {{ app_name }}
      Código: {{ app_src_dir }}
      Configuración: {{ app_config_dir }}
      Logs: {{ app_logs_dir }}

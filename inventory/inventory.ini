# ===========================================
# INVENTARIO DE ANSIBLE - ARCHIVO DE CONFIGURACIÓN
# ===========================================
# Este archivo define qué servidores/hosts puede gestionar Ansible
# Los corchetes [] definen grupos de hosts

# Grupo para ejecutar tareas localmente (en tu máquina)
[local]
localhost ansible_connection=local app_env=desarrollo app_name=mi-app-local
127.0.0.1 ansible_connection=local app_env=desarrollo app_name=mi-app-local

# Grupo para servidores web (usando localhost para práctica)
[webservers]
127.0.0.1 ansible_connection=local app_env=desarrollo app_name=mi-app-web
localhost ansible_connection=local app_env=desarrollo app_name=mi-app-web

# Grupo para servidores de base de datos (usando localhost para práctica)
[dbservers]
127.0.0.1 ansible_connection=local app_env=desarrollo app_name=mi-app-db
localhost ansible_connection=local app_env=desarrollo app_name=mi-app-db

# Grupo para aplicaciones (usando localhost para práctica)
[applications]
127.0.0.1 ansible_connection=local app_env=desarrollo app_name=mi-app-api
localhost ansible_connection=local app_env=desarrollo app_name=mi-app-api

# Grupo para monitoreo (usando localhost para práctica)
[monitoring]
127.0.0.1 ansible_connection=local app_env=desarrollo app_name=mi-app-mon
localhost ansible_connection=local app_env=desarrollo app_name=mi-app-mon

# Variables globales que se aplican a TODOS los hosts
# Estas variables definen cómo conectarse a los servidores
[all:vars]
# Para conexiones locales, no necesitamos usuario SSH
# ansible_user=ubuntu
# ansible_ssh_private_key_file=~/.ssh/id_rsa

# Configuración global de la aplicación
timezone=America/Mexico_City
python_version=3.13
log_level=INFO

# Configuración específica para hosts locales
[local:vars]
ansible_connection=local

# Variables específicas para servidores web
[webservers:vars]
web_port=8080
web_server=nginx
web_root=/var/www/html
ssl_enabled=false
max_connections=1000

# Variables específicas para servidores de base de datos
[dbservers:vars]
db_port=3306
db_type=mysql
db_name=mi_aplicacion
db_user=app_user
db_password=app_password
max_connections=200
backup_enabled=true

# Variables específicas para aplicaciones
[applications:vars]
app_port=5000
app_framework=flask
app_debug=true
app_secret_key=mi-clave-secreta-cambiar-en-produccion
session_timeout=3600

# Variables específicas para monitoreo
[monitoring:vars]
monitoring_port=9090
monitoring_tool=prometheus
metrics_retention_days=30
alert_enabled=true
dashboard_enabled=true
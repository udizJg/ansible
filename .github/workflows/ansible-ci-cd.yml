name: Ansible CI/CD Pipeline

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  ANSIBLE_FORCE_COLOR: true
  PYTHONUNBUFFERED: 1

jobs:
  # ===========================================
  # JOB 1: LINTING Y VALIDACIÓN
  # ===========================================
  lint-and-validate:
    name: Linting y Validación
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Instalar Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible ansible-lint yamllint

      - name: Validar sintaxis de playbooks
        run: |
          echo "🔍 Validando sintaxis de playbooks..."
          for playbook in playbooks/*.yml; do
            echo "Validando: $playbook"
            ansible-playbook --syntax-check "$playbook" || exit 1
          done

      - name: Linting con ansible-lint
        run: |
          echo "🧹 Ejecutando ansible-lint..."
          ansible-lint playbooks/ || echo "⚠️ Ansible-lint encontró warnings"

      - name: Linting con yamllint
        run: |
          echo "📝 Ejecutando yamllint..."
          yamllint . || echo "⚠️ YAML lint encontró warnings"

  # ===========================================
  # JOB 2: TESTING DE PLAYBOOKS
  # ===========================================
  test-playbooks:
    name: Testing de Playbooks
    runs-on: ubuntu-latest
    needs: lint-and-validate

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Instalar Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible

      - name: Configurar SSH para testing
        run: |
          mkdir -p ~/.ssh
          ssh-keygen -t rsa -b 4096 -f ~/.ssh/id_rsa -N ""
          cat ~/.ssh/id_rsa.pub >> ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys

      - name: Ejecutar tests de playbooks
        run: |
          echo "🧪 Ejecutando tests de playbooks..."

          # Test básico de conectividad
          ansible all -m ping -i inventory/inventory.ini --connection=local

          # Test de playbooks básicos
          ansible-playbook --check playbooks/01-hello-world.yml
          ansible-playbook --check playbooks/02-local-test.yml

          # Test de módulos básicos
          ansible-playbook --check playbooks/03-modulos-basicos.yml

          # Test de variables y facts
          ansible-playbook --check playbooks/04-variables-facts.yml

          echo "✅ Todos los tests pasaron"

  # ===========================================
  # JOB 3: BUILD DE DOCKER
  # ===========================================
  build-docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: test-playbooks

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build y push imagen base
        uses: docker/build-push-action@v5
        with:
          context: ./docker
          file: ./docker/Dockerfile.base
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/ansible-base:latest
            ${{ secrets.DOCKER_USERNAME }}/ansible-base:${{ github.sha }}

      - name: Build y push imagen de aplicación
        uses: docker/build-push-action@v5
        with:
          context: ./docker
          file: ./docker/Dockerfile.app
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/ansible-app:latest
            ${{ secrets.DOCKER_USERNAME }}/ansible-app:${{ github.sha }}

  # ===========================================
  # JOB 4: DESPLIEGUE A STAGING
  # ===========================================
  deploy-staging:
    name: Despliegue a Staging
    runs-on: ubuntu-latest
    needs: build-docker
    if: github.ref == 'refs/heads/development'

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Instalar Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible kubernetes openshift

      - name: Configurar acceso a Kubernetes
        uses: azure/k8s-set-context@v3
        with:
          kubeconfig: ${{ secrets.KUBECONFIG_STAGING }}

      - name: Desplegar a staging
        run: |
          echo "🚀 Desplegando a staging..."

          # Aplicar configuración de Kubernetes
          kubectl apply -f kubernetes/staging/

          # Ejecutar playbook de despliegue
          ansible-playbook ci-cd/deploy-staging.yml \
            -e "image_tag=${{ github.sha }}" \
            -e "environment=staging"

      - name: Verificar despliegue
        run: |
          echo "🔍 Verificando despliegue en staging..."
          kubectl get pods -n staging
          kubectl get services -n staging

  # ===========================================
  # JOB 5: DESPLIEGUE A PRODUCCIÓN
  # ===========================================
  deploy-production:
    name: Despliegue a Producción
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Instalar Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible kubernetes openshift

      - name: Configurar acceso a Kubernetes
        uses: azure/k8s-set-context@v3
        with:
          kubeconfig: ${{ secrets.KUBECONFIG_PRODUCTION }}

      - name: Desplegar a producción
        run: |
          echo "🚀 Desplegando a producción..."

          # Aplicar configuración de Kubernetes
          kubectl apply -f kubernetes/production/

          # Ejecutar playbook de despliegue
          ansible-playbook ci-cd/deploy-production.yml \
            -e "image_tag=${{ github.sha }}" \
            -e "environment=production"

      - name: Verificar despliegue
        run: |
          echo "🔍 Verificando despliegue en producción..."
          kubectl get pods -n production
          kubectl get services -n production

      - name: Notificar despliegue exitoso
        uses: 8398a7/action-slack@v3
        with:
          status: success
          text: '✅ Despliegue a producción completado exitosamente'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  # ===========================================
  # JOB 6: MONITORING Y ALERTING
  # ===========================================
  monitoring:
    name: Monitoring y Alerting
    runs-on: ubuntu-latest
    needs: [deploy-staging, deploy-production]
    if: always()

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Instalar herramientas de monitoring
        run: |
          python -m pip install --upgrade pip
          pip install prometheus-client requests

      - name: Ejecutar health checks
        run: |
          echo "🏥 Ejecutando health checks..."
          python monitoring/health_check.py

      - name: Configurar alertas
        run: |
          echo "🚨 Configurando alertas..."
          python monitoring/setup_alerts.py

      - name: Generar reporte de despliegue
        run: |
          echo "📊 Generando reporte de despliegue..."
          python monitoring/generate_report.py

      - name: Subir reporte como artifact
        uses: actions/upload-artifact@v4
        with:
          name: deployment-report
          path: monitoring/reports/

# ===========================================
# CONFIGURACIÓN DE ANSIBLE (ansible.cfg)
# ===========================================
# Este archivo define la configuración global de Ansible
# Se aplica a todos los comandos de Ansible en este directorio

# Configuraciones por defecto
[defaults]
# Ruta al archivo de inventario (lista de servidores)
inventory = inventory/inventory.ini

# Desactiva la verificación de claves SSH (útil para desarrollo)
# En producción, debería estar en True
host_key_checking = False

# Formato de salida más legible (YAML en lugar de JSON)
stdout_callback = yaml

# Estrategia de recopilación de facts (información del sistema)
# 'smart' = recopila solo si es necesario
gathering = smart

# Almacenamiento de facts en memoria para mejor rendimiento
fact_caching = memory

# Configuraciones de conexión SSH
[ssh_connection]
# Argumentos adicionales para SSH
# ControlMaster permite reutilizar conexiones SSH
ssh_args = -o ControlMaster=auto -o ControlPersist=60s

# Habilita pipelining para mejor rendimiento
# Reduce el número de conexiones SSH necesarias
pipelining = True 